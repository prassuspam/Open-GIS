<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoGlass Pro — Web GIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--tx:#0b1b33;--tx2:#46566e;--acc:#0a84ff;--g:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.22))}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;color:var(--tx)}
#map{position:fixed;inset:0;background:#cfe0f2}.leaflet-image-layer{image-rendering:pixelated}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid rgba(255,255,255,.65);border-radius:22px;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -1px 3px rgba(255,255,255,.3),0 14px 40px rgba(15,30,70,.28);position:fixed;z-index:1000}
#rib{top:12px;left:14px;right:14px;height:112px;padding:8px 14px}
#top{display:flex;align-items:center;gap:6px}#brand{font-weight:700;font-size:15px;margin-right:12px}
.tab{padding:5px 14px;border-radius:99px;cursor:pointer;font-weight:500}.tab.on{background:rgba(255,255,255,.7);box-shadow:inset 0 1px 1px #fff,0 2px 8px rgba(0,0,0,.12)}
#grp{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.btn{min-width:68px;padding:6px 8px;border-radius:16px;text-align:center;cursor:pointer;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 1px rgba(255,255,255,.8);font-size:11.5px;flex:none;transition:.15s}
.btn:hover{background:rgba(255,255,255,.65);transform:translateY(-1px)}.btn b{display:block;font-size:22px;font-weight:400;line-height:30px}
select,input[type=text],input[type=number],input[type=search]{width:100%;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);color:var(--tx);font:inherit;outline:0}
#cont{top:136px;left:14px;width:262px;bottom:50px;padding:14px;display:flex;flex-direction:column}
#gp{top:136px;right:14px;width:340px;bottom:50px;padding:14px;display:flex;flex-direction:column}
h4{font-size:14px;margin-bottom:8px}
#layers,#tree{flex:1;overflow:auto;margin-top:8px}
.ly{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;cursor:pointer}.ly:hover{background:rgba(255,255,255,.4)}.ly.sel{background:rgba(255,255,255,.75);box-shadow:inset 0 1px 1px #fff}
.ly span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ly i{font-style:normal;opacity:.55;font-size:12px}.ly i:hover{opacity:1}
details{margin-bottom:4px}summary{cursor:pointer;font-weight:600;padding:6px 8px;border-radius:10px}summary:hover{background:rgba(255,255,255,.35)}
.tl{padding:4px 8px 4px 22px;border-radius:9px;cursor:pointer}.tl:hover{background:var(--acc);color:#fff}
#dlg{display:none;margin-top:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,.5);overflow:auto;max-height:60%}
#dlg label{display:block;margin:8px 0 3px;font-weight:600;font-size:12px}#dlg p{color:var(--tx2);font-size:12px}
.go{margin-top:12px;width:100%;padding:8px;border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
#log{height:78px;overflow:auto;margin-top:8px;font-size:11.5px;color:var(--tx2);background:rgba(255,255,255,.3);border-radius:12px;padding:6px 9px}
#attr{left:290px;right:366px;bottom:50px;height:210px;padding:12px;display:none;overflow:auto}
#attr table{border-collapse:collapse;width:100%;font-size:12px}#attr th,#attr td{padding:4px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.6);white-space:nowrap}#attr th{position:sticky;top:0;background:rgba(255,255,255,.7)}
#st{bottom:8px;left:14px;right:14px;height:34px;border-radius:99px;display:flex;align-items:center;padding:0 18px;gap:24px;font-size:12px}
input[type=range]{width:100%}
@media(max-width:900px){#gp{width:290px}#attr{left:14px;right:14px}}
.cv{text-decoration:none;font-size:11px;opacity:.6;transition:transform .15s;display:inline-block;width:12px;cursor:pointer}.cv.o{transform:rotate(90deg)}
.ex{margin:0 4px 6px 24px;padding:4px 6px;border-radius:12px;background:rgba(255,255,255,.3);max-height:220px;overflow:auto;font-size:12px}
.ex h5{font-size:11px;color:var(--tx2);margin:6px 4px 2px}
.ei{display:flex;gap:6px;padding:3px 6px;border-radius:8px}.ei em{margin-left:auto;font-style:normal;color:var(--tx2);font-size:11px;white-space:nowrap}
.it,.bd{cursor:pointer}.it:hover,.bd:hover{background:rgba(255,255,255,.6)}.bd.on{background:var(--acc);color:#fff}.bd.on em{color:#fff}
</style></head><body>
<div id="map"></div>
<div id="rib" class="glass"><div id="top"><span id="brand">◉ GeoGlass Pro</span></div><div id="grp"></div></div>
<div id="cont" class="glass"><h4>Contents</h4><div id="layers"></div><div id="op" style="display:none"><label style="font-size:12px;font-weight:600">Transparency</label><input type="range" min="0" max="100" value="0" id="opr"></div></div>
<div id="gp" class="glass"><h4>Geoprocessing</h4><input type="search" id="ts" placeholder="Search tools (buffer, NDVI, clip…)"><div id="tree"></div><div id="dlg"></div><div id="log">Ready.</div></div>
<div id="attr" class="glass"></div>
<div id="st" class="glass"><span id="co">Lat/Lon: —</span><span id="zm">Zoom: —</span><span id="sl">No layer selected</span></div>
<input type="file" id="fi" accept=".json,.geojson,image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$$=s=>[...document.querySelectorAll(s)];
const map=L.map("map",{zoomControl:false,doubleClickZoom:false}).setView([16.5,80.6],8);
const BM={"OpenStreetMap":"https://tile.openstreetmap.org/{z}/{x}/{y}.png","Light":"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png","Dark":"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png","Imagery":"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}","Topographic":"https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"};
let base=null,BASE="Light";const setBase=n=>{base&&map.removeLayer(base);base=L.tileLayer(BM[n],{maxZoom:19,attribution:"© OSM / CARTO / Esri"}).addTo(map);base.bringToBack()};setBase(BASE);
map.on("mousemove",e=>$("#co").textContent="Lat/Lon: "+e.latlng.lat.toFixed(5)+", "+e.latlng.lng.toFixed(5));
map.on("zoomend",()=>$("#zm").textContent="Zoom: "+map.getZoom());map.fire("zoomend");
const log=m=>{const l=$("#log");l.innerHTML+="<br>"+new Date().toLocaleTimeString()+" — "+m;l.scrollTop=1e9};
/* layers */
let LY=[],sel=null,uid=0;const PAL=["#0a84ff","#ff375f","#30d158","#ff9f0a","#bf5af2","#64d2ff"];
const fc=a=>turf.featureCollection(a.filter(Boolean));
function addVector(name,gj,quiet){const col=PAL[uid%6],l={id:++uid,name,type:"v",gj,col,vis:true};
 l.lyr=L.geoJSON(gj,{style:{color:col,weight:2,fillOpacity:.25},pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:"#fff",weight:1.5,fillColor:col,fillOpacity:.95}),onEachFeature:(f,y)=>y.bindPopup(()=>"<b>"+f.geometry.type+"</b><br>"+Object.entries(f.properties||{}).map(([k,v])=>k+": "+(typeof v=="number"?+v.toFixed(4):v)).join("<br>"))}).addTo(map);
 LY.push(l);select(l);if(!quiet)log("Created vector layer “"+name+"” ("+gj.features.length+" features)");return l}
function addRaster(name,cv,bounds,quiet){const l={id:++uid,name,type:"r",cv,bounds,vis:true};l.lyr=L.imageOverlay(cv.toDataURL(),bounds,{opacity:1}).addTo(map);LY.push(l);select(l);if(!quiet)log("Created raster layer “"+name+"” ("+cv.width+"×"+cv.height+")");return l}
function select(l){sel=l;draw();$("#sl").textContent=l?l.name+(l.type=="v"?" · "+l.gj.features.length+" features":" · "+l.cv.width+"×"+l.cv.height+" px"):"No layer selected";$("#op").style.display=l?"block":"none";if($("#attr").style.display=="block")table()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bst(l){if(l._bs)return l._bs;const d=imgd(l).data,n=d.length/4,o=[0,1,2].map(()=>({mn:255,mx:0,s:0}));for(let i=0;i<n;i++)for(let c=0;c<3;c++){const v=d[i*4+c],b=o[c];if(v<b.mn)b.mn=v;if(v>b.mx)b.mx=v;b.s+=v}o.forEach(b=>b.m=b.s/n);return l._bs=o}
function showBand(l,c){l.band=c;l.lyr.setUrl(c<0?l.cv.toDataURL():rop(l,(r,g,b)=>{const v=[r,g,b][c];return [v,v,v]}).toDataURL())}
const iname=(f,i)=>{const p=f.properties||{};return esc(p.name||p.Name||p.NAME||Object.values(p).find(v=>typeof v=="string")||"Feature "+(i+1))};
function exHTML(l){
 if(l.type=="r"){const b=bst(l),nm=["Red","Green","Blue"];
  return '<h5>Size</h5><div class=ei>'+l.cv.width+' × '+l.cv.height+' px<em>3 bands, 8-bit</em></div><h5>Bands (3)</h5>'+nm.map((n,c)=>'<div class="ei bd'+(l.band===c?" on":"")+'" data-c='+c+'>'+n+'<em>'+b[c].mn+' to '+b[c].mx+', mean '+b[c].m.toFixed(1)+'</em></div>').join("")+'<div class="ei bd'+(l.band>=0?"":" on")+'" data-c=-1>Composite (RGB)</div>'}
 const F=l.gj.features,ks=[...new Set(F.slice(0,200).flatMap(f=>Object.keys(f.properties||{})))],gt=[...new Set(F.map(f=>f.geometry.type))].join(", ")||"empty";
 return '<h5>Geometry</h5><div class=ei>'+gt+'</div><h5>Fields ('+ks.length+')</h5>'+(ks.map(k=>{const f=F.find(f=>f.properties&&f.properties[k]!=null);return '<div class=ei>'+esc(k)+'<em>'+typeof(f&&f.properties[k])+'</em></div>'}).join("")||'<div class=ei>No attributes</div>')+'<h5>Items ('+F.length+')</h5>'+F.slice(0,300).map((f,i)=>'<div class="ei it" data-i='+i+'>'+iname(f,i)+'<em>'+f.geometry.type+'</em></div>').join("")+(F.length>300?'<div class=ei>Showing the first 300 items</div>':"")}
function draw(){$("#layers").innerHTML="";[...LY].reverse().forEach(l=>{const w=document.createElement("div"),d=document.createElement("div");d.className="ly"+(l===sel?" sel":"");
 d.innerHTML='<u class="cv'+(l.open?" o":"")+'">▸</u><input type=checkbox '+(l.vis?"checked":"")+'><span>'+(l.type=="v"?'<b style="color:'+l.col+'">●</b> ':"▦ ")+l.name+'</span><i title=Zoom>⌖</i><i title=Remove>✕</i>';
 d.onclick=()=>select(l);const [c,z,x]=d.querySelectorAll("input,i");c.onclick=e=>{e.stopPropagation();l.vis=c.checked;c.checked?l.lyr.addTo(map):map.removeLayer(l.lyr)};
 z.onclick=e=>{e.stopPropagation();zoomTo(l)};x.onclick=e=>{e.stopPropagation();map.removeLayer(l.lyr);LY=LY.filter(q=>q!==l);select(sel===l?LY[LY.length-1]||null:sel)};
 d.querySelector(".cv").onclick=e=>{e.stopPropagation();l.open=!l.open;draw()};w.append(d);
 if(l.open){const ex=document.createElement("div");ex.className="ex";ex.innerHTML=exHTML(l);ex.onclick=e=>{const t=e.target.closest(".ei");if(!t)return;
  if(t.dataset.c!=null){showBand(l,+t.dataset.c);draw()}else if(t.dataset.i!=null){const f=l.gj.features[+t.dataset.i];try{const b=L.geoJSON(f).getBounds();f.geometry.type=="Point"?map.setView(b.getCenter(),Math.max(map.getZoom(),12)):map.fitBounds(b,{padding:[60,60]})}catch(_){}}};w.append(ex)}
 $("#layers").append(w)})}
const zoomTo=l=>{try{map.fitBounds(l.type=="v"?l.lyr.getBounds():l.bounds,{padding:[60,60]})}catch(e){}};
$("#opr").oninput=e=>{if(!sel)return;const o=1-e.target.value/100;sel.type=="r"?sel.lyr.setOpacity(o):sel.lyr.setStyle({opacity:o,fillOpacity:.25*o})};
/* raster helpers */
const mk=(w,h,fn)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),i=x.createImageData(w,h);fn(i.data,w,h);x.putImageData(i,0,0);return c};
const imgd=l=>l.cv.getContext("2d").getImageData(0,0,l.cv.width,l.cv.height);
const gry=l=>{const d=imgd(l).data,g=new Float32Array(d.length/4);for(let i=0;i<g.length;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];return g};
const ST=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
const ramp=t=>{t=Math.max(0,Math.min(1,t))*4;const i=Math.min(3,t|0),f=t-i,a=ST[i],b=ST[i+1];return a.map((v,k)=>v+(b[k]-v)*f)};
const paint=(a,w,h,rp,mn,mx)=>{if(mn==null){mn=1e12;mx=-1e12;for(const v of a){if(v<mn)mn=v;if(v>mx)mx=v}}const k=mx-mn||1;return mk(w,h,o=>{for(let j=0;j<a.length;j++){const t=(a[j]-mn)/k,c=rp?ramp(t):[t*255,t*255,t*255];o[j*4]=c[0];o[j*4+1]=c[1];o[j*4+2]=c[2];o[j*4+3]=255}})};
const rop=(l,fn)=>{const s=imgd(l).data;return mk(l.cv.width,l.cv.height,o=>{for(let i=0;i<o.length;i+=4){const r=fn(s[i],s[i+1],s[i+2]);o[i]=r[0];o[i+1]=r[1];o[i+2]=r[2];o[i+3]=s[i+3]}})};
const conv=(g,w,h,k)=>{const o=new Float32Array(g.length);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let s=0,n=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)s+=g[(y+j)*w+x+i]*k[n++];o[y*w+x]=s}return o};
const KX=[-1,0,1,-2,0,2,-1,0,1],KY=[-1,-2,-1,0,0,0,1,2,1];
const cc=(l,k)=>{const s=imgd(l).data,w=l.cv.width,h=l.cv.height;return mk(w,h,o=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(y*w+x)*4;for(let c=0;c<3;c++){let v=0,n=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=Math.min(w-1,Math.max(0,x+i)),yy=Math.min(h-1,Math.max(0,y+j));v+=s[(yy*w+xx)*4+c]*k[n++]}o[p+c]=v}o[p+3]=255}})};
const ext=l=>[l.bounds[0][1],l.bounds[0][0],l.bounds[1][1],l.bounds[1][0]]; // W,S,E,N
const px2ll=(l,x,y)=>{const [W,S,E,N]=ext(l);return [W+(x+.5)/l.cv.width*(E-W),N-(y+.5)/l.cv.height*(N-S)]};
/* tools */
const TOOLS=[];const T=(cat,name,params,run,desc="")=>TOOLS.push({cat,name,params,run,desc});
const polys=l=>l.gj.features.filter(f=>/Polygon/.test(f.geometry.type)),pts=l=>l.gj.features.filter(f=>f.geometry.type=="Point");
const uni=a=>a.reduce((x,y)=>turf.union(x,y));
const mapBox=()=>{const b=map.getBounds();return [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]};
const IN=["in","v","Input features"],IR=["in","r","Input raster"];
const VA="Vector · Analysis",VM="Vector · Management",RA="Raster · Spatial Analyst",RI="Raster · Image Analyst";
T(VA,"Buffer",[IN,["d","n","Distance",10],["u","s","Units",0,["kilometers","meters","miles"]]],p=>fc(p.in.gj.features.map(f=>turf.buffer(f,p.d,{units:p.u}))),"Creates buffer polygons around features.");
T(VA,"Intersect",[["a","v","Input A (polygons)"],["b","v","Input B (polygons)"]],p=>{const o=[];polys(p.a).forEach(a=>polys(p.b).forEach(b=>{const i=turf.intersect(a,b);if(i){i.properties={...a.properties,...b.properties};o.push(i)}}));return fc(o)},"Overlap of two polygon layers.");
T(VA,"Clip",[IN,["c","v","Clip polygons"]],p=>{const u=uni(polys(p.c));return fc(p.in.gj.features.map(f=>{const r=f.geometry.type=="Point"?(turf.booleanPointInPolygon(f,u)?f:null):turf.intersect(f,u);if(r)r.properties=f.properties;return r}))},"Cuts input features to the clip boundary.");
T(VA,"Erase",[["in","v","Input polygons"],["c","v","Erase polygons"]],p=>{const u=uni(polys(p.c));return fc(polys(p.in).map(f=>{const d=turf.difference(f,u);if(d)d.properties=f.properties;return d}))},"Removes the overlap with the erase polygons.");
T(VA,"Union (merge)",[["a","v","Input A"],["b","v","Input B"]],p=>fc([uni([...polys(p.a),...polys(p.b)])]),"Merges two polygon layers into one geometry.");
T(VA,"Summarize Within",[["g","v","Polygons"],["p","v","Points"]],p=>fc(polys(p.g).map(g=>{g.properties={...g.properties,POINT_COUNT:turf.pointsWithinPolygon(fc(pts(p.p)),g).features.length};return g})),"Counts points inside each polygon.");
T(VA,"Near",[["in","v","Input features"],["n","v","Near features"]],p=>{const cs=fc(p.n.gj.features.map(f=>turf.centroid(f)));return fc(p.in.gj.features.map(f=>{const n=turf.nearestPoint(turf.centroid(f),cs);f.properties={...f.properties,NEAR_FID:n.properties.featureIndex,NEAR_DIST_KM:n.properties.distanceToPoint};return f}))},"Adds distance to the nearest feature.");
T(VM,"Dissolve",[["in","v","Input polygons"]],p=>fc([uni(polys(p.in))]),"Merges all polygons into one.");
T(VM,"Feature To Point",[IN],p=>fc(p.in.gj.features.map(f=>turf.centroid(f,{properties:f.properties}))),"Centroid of each feature.");
T(VM,"Feature Vertices To Points",[IN],p=>turf.explode(p.in.gj));
T(VM,"Polygon To Line",[["in","v","Input polygons"]],p=>fc(polys(p.in).map(f=>turf.polygonToLine(f))));
T(VM,"Simplify",[IN,["t","n","Tolerance (deg)",.01]],p=>turf.simplify(p.in.gj,{tolerance:p.t,highQuality:true,mutate:false}));
T(VM,"Calculate Geometry",[IN],p=>fc(p.in.gj.features.map(f=>{const g=f.geometry.type;f.properties={...f.properties};if(/Polygon/.test(g))f.properties.AREA_KM2=turf.area(f)/1e6;if(/Line/.test(g))f.properties.LENGTH_KM=turf.length(f);return f})),"Adds area (km²) or length (km).");
T(VM,"Minimum Bounding Envelope",[IN],p=>fc([turf.bboxPolygon(turf.bbox(p.in.gj))]));
T(VM,"Convex Hull",[IN],p=>fc([turf.convex(p.in.gj)]));
T(VM,"Concave Hull",[["in","v","Input points"],["m","n","Max edge (km)",60]],p=>fc([turf.concave(fc(pts(p.in)),{maxEdge:p.m})]));
T(VM,"Create Fishnet (map extent)",[["k","n","Cell size (km)",25],["t","s","Type",0,["square","hex"]]],p=>p.t=="hex"?turf.hexGrid(mapBox(),p.k,{units:"kilometers"}):turf.squareGrid(mapBox(),p.k,{units:"kilometers"}));
T(VM,"Create Random Points (map extent)",[["n","n","Count",100]],p=>{const r=turf.randomPoint(p.n,{bbox:mapBox()});r.features.forEach((f,i)=>f.properties={id:i+1,value:Math.round(Math.random()*100)});return r});
T("Vector · Proximity","Create Thiessen Polygons",[["in","v","Input points"]],p=>fc(turf.voronoi(fc(pts(p.in)),{bbox:turf.bbox(p.in.gj)}).features),"Voronoi polygons.");
T("Vector · Surfaces","Create TIN",[["in","v","Input points"]],p=>turf.tin(fc(pts(p.in)),"value"),"Delaunay triangulation.");
